spring.application.name=core

# 1. H2 Database Connection Settings
# 'mem:testdb' creates a temporary database in your system RAM
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Enable H2 Web Console (Highly recommended for viewing your data)
spring.h2.console.enabled=true
# Access path defaults to localhost:8080/h2-console
spring.h2.console.path=/h2-console

# 3. Hibernate/JPA Configuration
# 'create-drop' ensures a clean database schema is created on startup and destroyed on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allows the H2 console to be viewed inside an HTML frame (Spring Security fix)
spring.datasource.type=com.zaxxer.hikari.HikariDataSource